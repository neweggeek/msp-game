# Phone calls to the client: quick answers, quick tests and remote hands.
# A call is answered only during the client's hidden business hours, more often by
# contacts who are usually around. Every question costs minutes and some patience.
# Low competence means wrong answers, and sometimes the wrong device.
dialMinutes: 3
answerChance: { usually: 0.9, sometimes: 0.6, rarely: 0.35 }
# Questions before the contact has to get back to work: base + round(patience * perPoint).
patience: { base: 2, perPoint: 4 }
# Minutes a power-cycled device stays dark before it boots from its saved config.
rebootMinutes: 6

asks:
  - { id: test, kind: test, minutes: 5, ticket: true, label: "Can you try it now and tell me if it works?" }
  - { id: lights, kind: lights, minutes: 6, device: true, label: "Can you go look at {device}? Are its lights on?" }
  - { id: power-source, kind: power-source, minutes: 6, device: true, label: "What is {device} plugged into for power?" }
  - { id: power-cycle, kind: power-cycle, minutes: 8, device: true, label: "Unplug {device}, count to ten, and plug it back in." }
  - { id: after-hours, kind: fact, minutes: 2, label: "Is anyone in the office after hours?", default: "Not really. We lock up when we leave." }
  - { id: recent-changes, kind: fact, minutes: 2, label: "Did anything change around the office lately?", default: "Not that I know of." }
  - { id: isp-bill, kind: isp-bill, minutes: 4, label: "Can you find the internet bill and read me the account number and security PIN?" }
  - { id: modem-lights, kind: fact, minutes: 4, label: "Can you look at the internet provider's modem? What lights are on?", default: "All the lights are green, I think." }
  - { id: device-password, kind: device-password, minutes: 3, device: true, label: "Do you have the admin password for {device}?" }
  - { id: enable-account, kind: enable-account, minutes: 6, device: true, label: "Can you turn our admin account on {device} back on?" }
  - { id: closet-power, kind: fact, minutes: 3, label: "What does the network closet plug into?", default: "The outlets on the wall, I think. I don't go in there much." }

lines:
  noAnswer: "No answer. You leave a voicemail for {name}."
  closed: "Voicemail: {name} is out of the office right now."
  hello: "{name}: Hi, this is {name}."
  unwanted: "{name}: We asked for calls to go through your dispatcher. What is it?"
  tired: "{name}: Sorry, I have to get back to work. Call back later if you need me."
  lightsOk: "{name}: The lights are on and blinking."
  lightsLink: "{name}: It has power, but the light by the cable is off."
  lightsDark: "{name}: Nothing. No lights at all."
  lightsStorm: "{name}: Every light on it is flashing like crazy, all at the same time."
  notFound: "{name}: I can't find {device}. Is it labeled?"
  poeOnly: "{name}: Just the network cable. Nothing else."
  wall: "{name}: The wall outlet."
  unsure: "{name}: I can't really see behind it."
  cycled: "{name}: OK, it's back in. The lights are coming on."
  testFixed: "{name}: Yes, that works now. Go ahead and close it."
  testBroken: "{name}: No, still not working."
  testCollateral: "{name}: That part works now, but {down} stopped working."
  fixDone: "{name}: Done."
  ispBill: "{name}: The bill for {site} says account {account}, PIN {pin}."
  devicePassword: "{name}: Let me look. It's {password}."
  devicePasswordNone: "{name}: I don't have that. {main} keeps the passwords."
  accountEnabled: "{name}: OK, I logged in and turned it back on."
  accountNotMine: "{name}: I can't do that. {main} is the only one with the login."
  ispBillNone: "{name}: I don't have the bill here. Our office manager keeps those."

# Your own team. They pick up during MSP hours.
team:
  people:
    - { id: kyle, name: Kyle, role: tier 2 }
    - { id: maria, name: Maria, role: tier 1 }
    - { id: dev, name: Dev, role: senior }
  asks:
    - { id: vault-password, kind: vault-password, minutes: 3, label: "Did you change the password on {device}? The vault one doesn't work." }
  lines:
    hello: "{name}: Hey, what's up?"
    closed: "{name} is off for the day. Voicemail."
    unsaved: "{name}: Oh no. I changed it on the box and never saved it to the vault. It's {password}. I'll fix the entry, sorry."
    typo: "{name}: I updated that vault entry. I might have fat-fingered it. Try the version before mine in the docs history."
    notMe: "{name}: I haven't touched {device}. Try the docs history, the factory login, or the client."
    tired: "{name}: I have to jump on a call. Ping me if you need anything else."

# The ISP's support line for each site. The number comes from the docs.
isp:
  holdMinutes: [6, 30]
  patience: 8
  rebootMinutes: 6
  agents: [Dana, Marcus, Priya, Jordan, Lena, Tomas, Keisha, Ravi]
  asks:
    - { id: isp-verify, kind: isp-verify, minutes: 3, label: "Read the account number and PIN from the docs." }
    - { id: isp-status, kind: isp-status, minutes: 6, label: "Can you check the modem and the line at {site}?" }
    - { id: isp-reboot, kind: isp-reboot, minutes: 5, label: "Can you reboot the modem from your end?" }
  lines:
    hold: "On hold for {hold} minutes."
    hello: "{name}: Thanks for calling {isp} support. Can I have the account number and the security PIN?"
    you: "You: Account {account}, PIN {pin}."
    noPin: "You: The docs have no PIN for this account."
    noPinReply: "{name}: Without the PIN I can't go into the account. It's printed on the monthly bill."
    verified: "{name}: Thank you, you're verified. How can I help?"
    badPin: "{name}: I'm sorry, that doesn't match what we have. I can't go into the account without the right PIN."
    needVerify: "{name}: I need to verify the account first. Can I have the account number and PIN?"
    statusOutage: "{name}: I see the modem stopped checking in at {since}, right after a firmware push went out. It's stuck. I can reboot it from here."
    statusNothing: "{name}: The modem is online and the line is clean. I don't see anything behind the modem answering, though. Check your equipment."
    statusClean: "{name}: The modem is online, the line is clean, and I see traffic going both ways. Everything looks good on our side."
    reboot: "{name}: OK, I sent the reboot. Give it about {minutes} minutes to come back."
    statusRebooting: "{name}: The modem is still rebooting. Give it a few more minutes."
    tired: "{name}: Is there anything else? Then I'll note the account and let you go."
