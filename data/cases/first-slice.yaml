# Cases chain faults into one mystery. Roles name the devices the text and checks refer to.
# "fixed" checks decide when the real problem is gone. "note" feeds the resolution note picks.

- id: camera-day
  name: Camera Day
  pick: first-slice
  playbook: wifi
  requires:
    sites: [hq]
    kinds: { switch: 1, ap: 1, phone: 2 }
  roles:
    firewall: { kind: firewall, site: hq }
    switch: { kind: switch, site: hq }
  primary: ap
  ticket:
    origin: client
    priority: P2
    title: "Phones rebooting, {ap.room} Wi-Fi down"
    body: "Desk phones keep rebooting and the Wi-Fi in {ap.room} has been down since Monday. The camera installer was here Monday too."
  faults: [poe-budget-exhausted]
  fixed:
    - { type: device-online, role: ap }
  redHerring: "AP and phone firmware are a few versions behind, so it looks like a firmware bug."
  rootCause: "Four new cameras pushed {switch.hostname} past its PoE budget. Every port is low priority, so the switch cut power to the highest ports, including {ap.hostname}."
  fix: "Set PoE priority high on every AP and phone port so only cameras get shed, then quote a bigger PoE switch or a camera switch."
  note:
    issue: "Desk phones rebooting and {ap.hostname} ({ap.ip}) in {ap.room} offline since Monday."
    findings: "{switch.hostname} ({switch.ip}) was asking for more PoE than its budget after four new cameras were plugged in. Every port was low priority, so {ap.hostname} was denied power."
    changes: "Set PoE priority high on every AP and phone port on {switch.hostname}, so a camera is shed instead of {ap.hostname}."
    rootCause: "Four new cameras pushed {switch.hostname} past its PoE budget."
    nextSteps: "Sales: quote a larger PoE switch or a separate camera switch. Add the cameras to the docs."
    wrongCause: "AP and phone firmware bug after an update."
    wrongChange: "Rebooted {ap.hostname}."

- id: wrong-phonebook
  name: Wrong Phonebook
  pick: first-slice
  playbook: one-user
  requires:
    sites: [hq]
    kinds: { server: 1, pc: 2 }
  roles:
    user-pc: { kind: pc, site: hq, hasUser: true, pick: random }
    server: { kind: server, site: hq }
  primary: user-pc
  ticket:
    origin: client
    priority: P3
    title: "{user-pc.user} can't open the shared drive"
    body: "{user-pc.user} in {user-pc.room} says the S: drive on {server.hostname} won't open since yesterday afternoon. Internet works fine. Nobody else has a problem."
  faults: [static-public-dns]
  fixed:
    - { type: dns-internal, role: user-pc }
  redHerring: "The file server could be down, or the user's account could be locked."
  rootCause: "{user-pc.hostname} has public DNS servers typed in, so it can't resolve {server.hostname}."
  fix: "Reset the adapter DNS to DHCP with consent, then test the share."
  note:
    issue: "{user-pc.user} on {user-pc.hostname} ({user-pc.ip}) could not open shares on {server.hostname} ({server.ip})."
    findings: "{user-pc.hostname} had DNS set by hand to 8.8.8.8 and 8.8.4.4. Ping to {server.ip} worked, name lookups failed."
    changes: "With {user-pc.user}'s OK, reset the DNS servers on {user-pc.hostname} to DHCP."
    rootCause: "Public DNS servers typed into {user-pc.hostname} cannot resolve internal names."
    nextSteps: "None."
    wrongCause: "{server.hostname} file share permissions."
    wrongChange: "Restarted the Server service on {server.hostname}."

- id: nobody-home
  name: Nobody Home
  pick: first-slice
  playbook: site-down
  requires:
    sites: [hq]
    kinds: { server: 1 }
    probe: true
  roles:
    probe: { kind: pc, site: hq, tag: probe }
    server: { kind: server, site: hq }
    firewall: { kind: firewall, site: hq }
  primary: probe
  ticket:
    origin: alert
    priority: P3
    title: "Ovik: {site} site down at 22:04"
    body: "Ovik raised a site-down alert for {site} at 22:04 last night. It cleared at 07:30. No calls from the client."
  faults: [probe-sleeps]
  fixed:
    - { type: no-sleep, role: probe }
  redHerring: "It looks like a nightly ISP or power outage."
  rootCause: "The Ovik probe PC {probe.hostname} goes to sleep at night, so monitoring loses the whole site."
  fix: "Set the probe PC's power plan to never sleep."
  note:
    issue: "Ovik reported {site} down every night from 22:04 to 07:30."
    findings: "{server.hostname} ({server.ip}) and {firewall.hostname} ({firewall.ip}) stayed up all night. The probe {probe.hostname} ({probe.ip}) was asleep."
    changes: "Set the power plan on {probe.hostname} to never sleep."
    rootCause: "The monitoring probe PC sleeps after 30 minutes idle."
    nextSteps: "Move the probe to {server.hostname} at the next review."
    wrongCause: "Nightly ISP outage."
    wrongChange: "Opened an ISP ticket."

- id: branch-silence
  name: Branch Silence
  pick: first-slice
  playbook: tunnel
  requires:
    sites: [hq, branch]
    kinds: { firewall: 2, server: 1 }
  roles:
    fw-hq: { kind: firewall, site: hq }
    fw-branch: { kind: firewall, site: branch }
    branch-pc: { kind: pc, site: branch, pick: random }
    server: { kind: server, site: hq }
  primary: fw-hq
  ticket:
    origin: client
    priority: P2
    title: "Branch can't reach {server.hostname}"
    body: "Staff at the branch can't open anything on {server.hostname} since Monday morning. Internet at the branch works. The ISP did work at the branch Monday."
    history:
      - { at: "0d 11:40", by: "Kyle (tier 2)", text: "Changed phase 2 on {fw-branch.hostname} trying to bring the tunnel up. Still down. Escalating." }
  faults: [branch-wan-changed, phase2-mangled]
  fixed:
    - { type: tunnel-up, role: fw-hq }
  redHerring: "It looks like a phase 1 proposal mismatch or a broken VPN service."
  rootCause: "The ISP changed the branch WAN IP, so {fw-hq.hostname} was dialing the old address. Then the phase 2 change on {fw-branch.hostname} broke the selectors."
  fix: "Point phase 1 on {fw-hq.hostname} at the new branch WAN IP, fix phase 2 on {fw-branch.hostname}, update the docs."
  note:
    issue: "Branch tunnel between {fw-hq.hostname} ({fw-hq.ip}) and {fw-branch.hostname} ({fw-branch.ip}) down since Monday."
    findings: "Branch WAN IP changed after ISP work. Phase 2 on {fw-branch.hostname} had the wrong remote subnet after an earlier edit."
    changes: "Set the phase 1 remote gateway on {fw-hq.hostname} to the new branch WAN IP. Fixed the phase 2 remote subnet on {fw-branch.hostname}. Updated the WAN IP in the docs."
    rootCause: "ISP changed the branch WAN IP; then a phase 2 edit broke the selectors."
    nextSteps: "Ask the ISP for a static IP at the branch."
    wrongCause: "Phase 1 encryption proposal mismatch."
    wrongChange: "Rebooted {fw-branch.hostname}."

- id: tuesday-seven
  name: Tuesday, 7 PM
  pick: first-slice
  playbook: site-down
  requires:
    sites: [hq]
    kinds: { firewall: 1, switch: 1 }
  roles:
    firewall: { kind: firewall, site: hq }
    switch: { kind: switch, site: hq }
  primary: firewall
  ticket:
    origin: client
    priority: P3
    title: "Internet drops every Tuesday evening"
    body: "The whole office loses internet around 7 PM on Tuesdays. Three weeks in a row now. It comes back on its own after about half an hour. Evening staff lose whatever they were working on."
  faults: [closet-power-strip]
  fixed:
    - { type: no-power-cut, role: firewall }
    - { type: no-power-cut, role: switch }
  call:
    facts:
      after-hours: "Just the cleaning crew. They come in Tuesday evenings around 7."
      closet-power: "Everything in there plugs into a power strip on the floor by the door. I think the cleaners use that outlet too."
    testBroken: "It only happens Tuesday nights, so I can't tell you yet. Nothing in the closet has changed that I know of."
    testFixed: "Everything in the closet is on the wall outlet now and labeled. Go ahead and close it. We'll call if it drops next Tuesday."
    fixes:
      - id: closet-wall-outlet
        label: "Plug the closet gear into the wall outlet behind the rack, and put a DO NOT UNPLUG label on it."
        unlockedBy: closet-power
        effect: end-power-cut
        roles: [firewall, switch]
  redHerring: "It looks like the ISP drops every Tuesday evening."
  rootCause: "The cleaning crew unplugs the closet power strip to plug in a vacuum, which cuts power to {firewall.hostname} and {switch.hostname}."
  fix: "Have a contact move the closet gear to the wall outlet behind the rack and label it, then confirm on a call."
  note:
    issue: "Whole site offline every Tuesday from about 19:02 to 19:37."
    findings: "{firewall.hostname} ({firewall.ip}) uptime reset every Tuesday at 19:37. Ovik showed every device down at once. The closet gear was on a floor power strip the cleaning crew uses for a vacuum."
    changes: "A contact moved {firewall.hostname} and {switch.hostname} ({switch.ip}) to the wall outlet behind the rack and labeled it."
    rootCause: "The cleaning crew unplugs the closet power strip on Tuesday evenings."
    nextSteps: "Sales: quote a small UPS for the closet."
    wrongCause: "Weekly ISP outage."
    wrongChange: "Opened a ticket with the ISP."

- id: lights-out
  name: Lights Out
  pick: first-slice
  playbook: one-device
  requires:
    sites: [hq]
    kinds: { nvr: 1, switch: 1 }
  roles:
    nvr: { kind: nvr, site: hq }
    switch: { kind: switch, site: hq }
  primary: nvr
  ticket:
    origin: client
    priority: P3
    title: "Camera recorder has no video overnight"
    body: "The camera recorder {nvr.hostname} in {nvr.room} has no recordings from about 6:30 PM until 7:40 AM. It started about a week ago. Daytime video is fine."
  faults: [nvr-switched-outlet]
  fixed:
    - { type: no-power-cut, role: nvr }
  call:
    facts:
      after-hours: "The last one out turns off all the lights, usually around 6:30."
      recent-changes: "We had an electrician in last week. He put the office outlets on the light switches."
    testBroken: "Still no video from last night. I won't know more until tomorrow morning."
    testFixed: "It's on the always-on outlet now, with a label. Go ahead and close it. I'll check the video tomorrow."
    fixes:
      - id: nvr-always-on
        label: "Move {nvr.hostname}'s plug to the always-on outlet on the wall, and put a label on it."
        unlockedBy: "power:nvr"
        effect: end-power-cut
        roles: [nvr]
  redHerring: "It looks like a firmware crash or a scheduled reboot on the recorder."
  rootCause: "{nvr.hostname} is plugged into an outlet that the office light switch turns off."
  fix: "Have a contact move the recorder to an always-on outlet and label it."
  note:
    issue: "{nvr.hostname} ({nvr.ip}) offline every night from 18:30 to 07:40, so no overnight video."
    findings: "Ovik showed only {nvr.hostname} dropping, at the same times every day. The contact said it plugs into the outlet on the light switch, which an electrician wired last week."
    changes: "A contact moved {nvr.hostname} to the always-on outlet and labeled it."
    rootCause: "The recorder's outlet is switched with the office lights."
    nextSteps: "Check overnight video tomorrow. Quote a small UPS for the recorder."
    wrongCause: "Recorder firmware crashes every night."
    wrongChange: "Updated the recorder firmware."

- id: tidy-desk
  name: Tidy Desk
  pick: first-slice
  playbook: site-down
  requires:
    sites: [hq]
    kinds: { switch: 1, pc: 1 }
  roles:
    switch: { kind: switch, site: hq }
    pc: { kind: pc, site: hq, pick: random }
  primary: switch
  ticket:
    origin: client
    priority: P1
    title: "Nothing works at the office"
    body: "Nothing works this morning. No internet, no phones, no printing. It was fine when we left last night."
  faults: [desk-loop]
  fixed:
    - { type: no-loop, role: switch }
    - { type: device-online, role: switch }
  call:
    facts:
      recent-changes: "The cleaning crew moved the desks in {pc.room} last night. They plugged a bunch of loose cables back in."
    fixes:
      - id: unplug-desk-loop
        label: "Look under the desks in {pc.room} for a cable with both ends in wall jacks, and unplug one end."
        unlockedBy: recent-changes
        effect: unplug-loop
        roles: [switch]
  redHerring: "It looks like the internet is down, or the firewall died overnight."
  rootCause: "A patch cable joins two wall jacks in {pc.room}, which loops {switch.hostname} back into itself. Loop protection is off, so a broadcast storm floods the switch."
  fix: "Have a contact find the cable with both ends in the wall in {pc.room} and unplug one end. Turn on loop protection later."
  note:
    issue: "Whole office down since 19:24 last night. {switch.hostname} ({switch.ip}) and everything behind it unreachable."
    findings: "Every agent dropped at the same minute. A contact said all the lights on {switch.hostname} flash at once, and the cleaners replugged cables in {pc.room}."
    changes: "A contact unplugged a patch cable that joined two wall jacks in {pc.room}."
    rootCause: "A switch loop through two wall jacks caused a broadcast storm."
    nextSteps: "Turn on loop protection and BPDU guard on {switch.hostname} access ports. Label spare jacks."
    wrongCause: "The ISP circuit went down overnight."
    wrongChange: "Opened a ticket with the ISP."

- id: stuck-modem
  name: Overnight Update
  pick: first-slice
  playbook: site-down
  requires:
    sites: [hq]
    kinds: { firewall: 1 }
  roles:
    firewall: { kind: firewall, site: hq }
  primary: firewall
  ticket:
    origin: client
    priority: P1
    title: "Internet is down at the office"
    body: "No internet since we got in this morning. Email and the shared drive don't work either."
  faults: [modem-provisioning]
  fixed:
    - { type: isp-up, role: firewall }
  call:
    facts:
      modem-lights: "The one that says Online is blinking orange. The rest are green."
  redHerring: "It looks like the firewall {firewall.hostname} died overnight."
  rootCause: "The ISP pushed firmware to the modem at 02:14 and it never came back online. {firewall.hostname} is fine."
  fix: "Call the ISP with the account number and PIN and have them reboot the modem."
  note:
    issue: "No internet at the office since 02:14. Every agent offline, {firewall.hostname} ({firewall.ip}) unreachable."
    findings: "The modem's Online light was blinking orange. The ISP said the modem stopped checking in at 02:14 after a firmware push."
    changes: "The ISP rebooted the modem from their end. Internet came back."
    rootCause: "An ISP firmware push left the modem stuck offline."
    nextSteps: "Ask the ISP for a ticket number and a note on future pushes. Keep the ISP PIN in the docs."
    wrongCause: "The firewall locked up overnight."
    wrongChange: "Had the client power-cycle the firewall."

- id: codes-rejected
  name: Codes Rejected
  pick: first-slice
  playbook: access
  requires:
    sites: [hq]
    kinds: { firewall: 1 }
    vpn: totp
  roles:
    firewall: { kind: firewall, site: hq }
  primary: firewall
  ticket:
    origin: tech
    priority: P3
    title: "MSP VPN rejects every authenticator code"
    body: "Kyle (tier 2): I tried the MSP VPN to {firewall.hostname} this morning. It took the password, then rejected three fresh authenticator codes and locked me out. The codes on my phone look right. Nothing is down for the client, but we need the VPN back."
    history:
      - { at: "1d 07:24", by: "Kyle (tier 2)", text: "Three codes rejected on the VPN, account locked for 30 minutes. Escalating to network." }
  faults: [firewall-clock-drift]
  fixed:
    - { type: clock-synced, role: firewall }
  redHerring: "The authenticator token looks broken, or someone changed the VPN password."
  rootCause: "NTP sync is off on {firewall.hostname}, so its clock drifted minutes away from real time. Token codes are checked against that clock, so every fresh code looks expired."
  fix: "Get on {firewall.hostname} another way (RMM, then SSH). Run config system ntp, set ntpsync enable, end. Then connect the VPN with a fresh code."
  note:
    issue: "MSP VPN to {firewall.hostname} ({firewall.ip}) rejected every authenticator code and locked the account."
    findings: "get system status on {firewall.hostname} showed the clock minutes off. NTP sync was disabled. The SSL VPN log showed the rejected codes."
    changes: "Turned NTP sync back on for {firewall.hostname}. The clock came back to the right time, and a fresh code connected."
    rootCause: "Firewall clock drift with NTP sync off made every token code look expired."
    nextSteps: "Add an Ovik check for clock drift on {firewall.hostname}. Find out who turned NTP off."
    wrongCause: "The authenticator token on the phone was out of sync."
    wrongChange: "Re-enrolled the authenticator token."
