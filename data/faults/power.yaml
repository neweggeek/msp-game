- id: probe-sleeps
  name: Monitoring probe PC goes to sleep at night
  layer: 8
  device: pc
  startedAt: "-3d 22:04"
  effects:
    - { type: sleep-nightly, target: probe, from: "22:04", to: "07:30" }
  proof: []
  clues:
    - id: site-down-nightly
      text: "Ovik history shows every device at the site down from 22:04 to 07:30, every night."
      surface: monitoring
      requires: monitoring
    - id: server-uptime
      text: "RMM shows {server.hostname} up for weeks with no drop overnight."
      surface: rmm
      requires: "rmm:server"
    - id: probe-sleep
      text: "powercfg on {probe.hostname} shows it sleeps after 30 minutes idle."
      surface: rmm
      requires: "rmm:probe"
- id: closet-power-strip
  name: Cleaning crew unplugs the closet power strip every Tuesday
  layer: 1
  device: firewall
  startedAt: "-20d 19:02"
  effects:
    - { type: power-cut, target: firewall, days: [1], from: "19:02", to: "19:37", source: "A power strip on the floor by the closet door.", fixedSource: "The wall outlet behind the rack." }
    - { type: power-cut, target: switch, days: [1], from: "19:02", to: "19:37", source: "A power strip on the floor by the closet door.", fixedSource: "The wall outlet behind the rack." }
  proof: []
  clues:
    - id: tuesday-pattern
      text: "Ovik history shows the whole site down from 19:02 to 19:37 on each of the last three Tuesdays, and nothing on other days."
      surface: monitoring
      requires: monitoring
    - id: fw-uptime
      text: "get system performance status on {firewall.hostname} shows uptime of about six and a half days: it came up last Tuesday at 19:37."
      surface: cli
      requires: "ssh:firewall"
    - id: cleaners
      text: "On a call, a contact says the cleaning crew comes Tuesdays around 7, and the closet gear plugs into a power strip by the door."
      surface: call
      requires: hands
- id: nvr-switched-outlet
  name: Recorder plugged into an outlet on the light switch
  layer: 1
  device: nvr
  startedAt: "-7d 18:30"
  effects:
    - { type: power-cut, target: nvr, days: [0, 1, 2, 3, 4, 5, 6], from: "18:30", to: "07:40", source: "The outlet by the door. That one goes off with the light switch.", fixedSource: "The always-on outlet on the wall behind it." }
  proof: []
  clues:
    - id: nightly-pattern
      text: "Ovik history shows {nvr.hostname} ({nvr.ip}) down every evening at 18:30 and back at 07:40, and nothing else at the site drops."
      surface: monitoring
      requires: monitoring
    - id: switched-outlet
      text: "On a call, a contact says {nvr.hostname} plugs into the outlet by the door in {nvr.room}, the one on the light switch."
      surface: call
      requires: hands
