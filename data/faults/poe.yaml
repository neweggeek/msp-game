# Faults from spec/02-device-faults.md. Effects and proofs use engine primitives.
- id: poe-budget-exhausted
  name: PoE budget exhausted, every port the same priority
  layer: 1
  device: switch
  effects:
    - { type: set-poe-priority-all, value: low }
    - { type: add-endpoints, template: hawkvision-ptz4, count: 4, label: "CAM-{nn}" }
  proof:
    - { type: poe-denied, kind: ap }
  clues:
    - id: ap-offline
      text: "Ovik shows {ap.hostname} ({ap.ip}) offline since Monday."
      surface: monitoring
      requires: monitoring
    - id: poe-over-budget
      text: "diagnose switch poe status on {firewall.hostname} shows {switch.hostname} over its PoE budget."
      surface: cli
      requires: "ssh:firewall"
    - id: cameras-in-arp
      text: "get system arp on {firewall.hostname} lists four new camera addresses."
      surface: cli
      requires: "ssh:firewall"
