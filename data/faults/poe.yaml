# Faults from spec/02-device-faults.md. Effects, proofs and checks use engine primitives.
# "startedAt" is game time: "<day>d HH:MM", day 0 is the Monday before play starts.
- id: poe-budget-exhausted
  name: PoE budget exhausted, every port the same priority
  layer: 1
  device: switch
  startedAt: "0d 10:30"
  effects:
    - { type: set-poe-priority-all, target: switch, value: low }
    - { type: add-endpoints, target: switch, template: hawkvision-ptz4, count: 4, label: "CAM-{nn}" }
  proof:
    - { type: poe-denied, kind: ap }
  clues:
    - id: ap-offline
      text: "Ovik shows {ap.hostname} ({ap.ip}) offline since Monday 10:30."
      surface: monitoring
      requires: monitoring
    - id: poe-over-budget
      text: "{switch.hostname}'s PoE status (show power-over-ethernet, or the cloud dashboard) shows it over its PoE budget with {ap.hostname} denied."
      surface: cli
      requires: "ssh:switch|cloud"
    - id: cameras-in-arp
      text: "get system arp on {firewall.hostname} lists four camera addresses missing from the docs."
      surface: cli
      requires: "ssh:firewall"
